<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>AtomOS</Name>
    <Username>Project Atom</Username>
    <Title>Atom Playbook</Title>
    <ShortDescription>Windows 10/11: debloat and low latency.</ShortDescription>
    <Description>Three profiles. Tiny for speed, Lite for daily use, Standard to keep Windows intact.</Description>
    <Details>0.5 ms timer, fewer background services, lower input latency. Restart required.</Details>
    <ProgressText>Applying your profile. Keep this window open. Restart when it finishes.</ProgressText>
    <Version>0.0.9</Version>
    <UniqueId>537690f4-a419-4c12-a096-ba093d6f232b</UniqueId>
    <EstimatedMinutes>60</EstimatedMinutes>
    <Git>https://github.com/ProjectAtomOS/Atom-Playbook</Git>
    <Website>https://www.atom-os.com/</Website>
    <UseKernelDriver>false</UseKernelDriver>
    <SupportedBuilds>
        <string>19044</string>
        <string>19045</string>
        <string>22000</string>
        <string>22621</string>
        <string>22631</string>
        <string>23620</string>
        <string>26100</string>
        <string>26200</string>
        <string>26300</string>
        <string>27000</string>
        <string>27100</string>
        <string>27200</string>
        <string>27300</string>
        <string>27400</string>
        <string>27500</string>
        <string>27600</string>
        <string>27700</string>
        <string>27800</string>
        <string>27900</string>
        <string>28000</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>Internet</Requirement>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <FeaturePages>
        <!-- AME rule: a RadioPage with both TopLine and BottomLine allows only 2 options.
             This page has 3, so it uses TopLine only. -->
        <RadioPage IsRequired="true" DefaultOption="profile-light" Description="Tiny is fastest. Lite is the default. Standard changes the least.">
            <TopLine Text="Pick Lite unless you know you need Tiny."/>
            <Options>
                <RadioOption>
                    <Text>Tiny: fastest, unsupported</Text>
                    <Name>profile-tiny</Name>
                    <Description>Removes Defender, Store, Edge, updates and recovery. No pagefile. Compressed.</Description>
                </RadioOption>
                <RadioOption>
                    <Text>Lite: recommended</Text>
                    <Name>profile-light</Name>
                    <Description>Removes telemetry and bloat. Keeps pagefile, recovery and Windows Update. Compressed.</Description>
                </RadioOption>
                <RadioOption>
                    <Text>Standard: least changes</Text>
                    <Name>profile-standard</Name>
                    <Description>Removes telemetry and ads only. Defender, Store, updates and recovery stay.</Description>
                </RadioOption>
            </Options>
        </RadioPage>
        <RadioImagePage IsRequired="true" CheckDefaultBrowser="true" DefaultOption="browser-brave" Description="Pick a browser. Edge is removed on every profile, even if you pick None.">
            <TopLine Text="Installed silently. Settings untouched."/>
            <Options>
                <RadioImageOption None="true"/>
                <RadioImageOption>
                    <Text>Brave</Text>
                    <Name>browser-brave</Name>
                    <FileName>brave</FileName>
                    <GradientTopColor>#A33401</GradientTopColor>
                    <GradientBottomColor>#FFC481</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Firefox</Text>
                    <Name>browser-firefox</Name>
                    <FileName>firefox</FileName>
                    <GradientTopColor>#0B1B3A</GradientTopColor>
                    <GradientBottomColor>#6B4BFF</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Chrome</Text>
                    <Name>browser-chrome</Name>
                    <FileName>chrome</FileName>
                    <GradientTopColor>#1B5E20</GradientTopColor>
                    <GradientBottomColor>#F9D423</GradientBottomColor>
                </RadioImageOption>
            </Options>
            <BottomLine Text="None: Edge still goes, nothing is installed." Link="https://www.atom-os.com/docs"/>
        </RadioImagePage>
        <CheckboxPage IsRequired="true" Description="Tiny and Lite turn these off unless ticked. Standard always keeps them.">
            <TopLine Text="Tick only what you use."/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Bluetooth</Text>
                    <Name>keep-bluetooth</Name>
                    <Description>Keeps Bluetooth services and drivers.</Description>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Printing</Text>
                    <Name>keep-printing</Name>
                    <Description>Keeps the print spooler and scan services.</Description>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Windows Search</Text>
                    <Name>keep-search</Name>
                    <Description>Keeps search and indexing.</Description>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <RadioPage IsRequired="true" DefaultOption="store-xbox-keep" Description="Tiny always removes both. Lite and Standard follow your choice.">
            <Options>
                <RadioOption>
                    <Text>Keep Store and Xbox</Text>
                    <Name>store-xbox-keep</Name>
                    <Description>Store apps, Game Pass and Xbox services keep working.</Description>
                </RadioOption>
                <RadioOption>
                    <Text>Remove Store and Xbox</Text>
                    <Name>store-xbox-remove</Name>
                    <Description>Removes Store, Xbox, Game Bar and Game DVR. winget stays.</Description>
                </RadioOption>
            </Options>
        </RadioPage>
        <RadioPage IsRequired="true" DefaultOption="defender-keep" Description="Removing Defender is hard to undo. Keep it unless you know why.">
            <Options>
                <RadioOption>
                    <Text>Keep Defender</Text>
                    <Name>defender-keep</Name>
                    <Description>Defender, SmartScreen and Security app stay on.</Description>
                </RadioOption>
                <RadioOption>
                    <Text>Remove Defender</Text>
                    <Name>defender-disable</Name>
                    <Description>Deletes Defender services and drivers. Needs a repair install to restore.</Description>
                </RadioOption>
            </Options>
        </RadioPage>
    </FeaturePages>
</Playbook>
