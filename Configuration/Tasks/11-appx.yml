  # every list in this file. No profile removes it.
  # Clear AppX caches
  - !appx: {operation: clearCache, name: '*Client.CBS*', errorAction: Ignore}
  - !appx: {operation: clearCache, name: '*StartMenuExperienceHost*', errorAction: Ignore}
  - !appx: {operation: clearCache, name: '*TCUI*', errorAction: Ignore}

  # ===============================================================
  # ONEDRIVE — removed on every profile, early, so the space is free
  # before the compression pass. CLEANUP.ps1 does the deep sweep later.
  # ===============================================================
  - !taskKill: {name: 'OneDrive', errorAction: Ignore}
  - !taskKill: {name: 'OneDriveSetup', errorAction: Ignore}
  - !taskKill: {name: 'OneDriveStandaloneUpdater', errorAction: Ignore}
  - !appx: {name: '*OneDrive*', type: family, errorAction: Ignore}
  - !appx: {name: '*Microsoft.SkyDrive*', type: family, errorAction: Ignore}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\OneDrive', value: 'DisableFileSyncNGSC', type: REG_DWORD, data: '1', errorAction: Ignore}
  - !powerShell:
    command: >-
      $paths = @(
        "$env:SystemRoot\System32\OneDriveSetup.exe",
        "$env:SystemRoot\SysWOW64\OneDriveSetup.exe"
      );
      foreach ($p in $paths) { if (Test-Path $p) { Remove-Item $p -Force -ErrorAction SilentlyContinue } }
    errorAction: Ignore
