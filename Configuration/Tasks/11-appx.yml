---
title: Bloatware Removal
description: Remove telemetry, consumer and inbox bloat packages (all profiles)
privilege: TrustedInstaller
actions:

  # Snapshot installed families so 24-shrink can delete the staged payload of
  # exactly the apps this run removes.
  - !powerShell:
    command: |
      (Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue).PackageFamilyName |
        Sort-Object -Unique |
        Set-Content -Path "$env:SystemRoot\Temp\atom-appx-before.txt" -Encoding UTF8 -Force
    errorAction: Ignore

  - !status: {status: 'Removing AppX packages...'}

