---
title: Hardware Service Toggles
description: Bluetooth, printing and Windows Search - disabled by default on Tiny and Lite
privilege: TrustedInstaller
actions:

  - !status: {status: 'Configuring optional hardware services...'}

  # ===============================================================
  # BLUETOOTH - every Bluetooth service, not just the radio
  # ===============================================================
  - !service: {name: 'BluetoothUserService', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BthAvctpSvc', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BthEnum', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BthHFEnum', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BthLEEnum', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BthA2dp', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BTHMODEM', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'Microsoft_Bluetooth_AvrcpTransport', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'Microsoft_Bluetooth_AvctpTransport', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'RFCOMM', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'bthserv', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BTAGService', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BluetoothAudioSvc', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BthMini', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}
  - !service: {name: 'BthRadUsb', operation: change, startup: 4, errorAction: Ignore, option: '!keep-bluetooth'}

  # ===============================================================
  # PRINTING AND SCANNING
  # ===============================================================
  - !service: {name: 'Spooler', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}
  - !service: {name: 'printworkflowusersvc', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}
  - !service: {name: 'stisvc', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}
  - !service: {name: 'PrintNotify', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}
  - !service: {name: 'usbprint', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}
  - !service: {name: 'PrintScanBrokerService', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}
  - !service: {name: 'PrintDeviceConfigurationService', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}
  - !service: {name: 'LPTEnum', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}
  - !service: {name: 'Parallel', operation: change, startup: 4, errorAction: Ignore, option: '!keep-printing'}

  # ===============================================================
  # WINDOWS SEARCH - service, UI packages and index cache
  # ===============================================================
  - !service: {name: 'WSearch', operation: change, startup: 4, errorAction: Ignore, option: '!keep-search'}

  - !appx: {name: '*Microsoft.BingSearch*', type: family, errorAction: Ignore, option: '!keep-search'}
  - !appx: {name: '*Microsoft.Windows.Search*', type: family, errorAction: Ignore, option: '!keep-search'}
  - !appx: {name: '*MicrosoftWindows.LKG.Search*', type: family, errorAction: Ignore, option: '!keep-search'}
  - !appx: {name: '*Cortana*', type: family, errorAction: Ignore, option: '!keep-search'}
  - !appx: {name: '*AI.*', type: family, errorAction: Ignore, option: '!keep-search'}
  - !appx: {name: '*AIChat*', type: family, errorAction: Ignore, option: '!keep-search'}
  - !appx: {name: '*CortanaUI*', type: app, errorAction: Ignore, option: '!keep-search'}
  - !appx: {name: '*MiniSearchUI*', type: app, errorAction: Ignore, option: '!keep-search'}
  - !appx: {name: '*FESearchUI*', type: app, errorAction: Ignore, option: '!keep-search'}
  - !appx: {operation: clearCache, name: '*Windows.Search*', errorAction: Ignore, option: '!keep-search'}
