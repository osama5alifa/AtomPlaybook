---
title: Core Services
description: Disable non-essential user-mode services (AtomOS shared baseline)
privilege: TrustedInstaller
actions:

  # Camera/mic privacy toggles depend on this
  - !service: {name: 'camsvc', operation: change, startup: 3, errorAction: Ignore}

  - !status: {status: 'Disabling services...'}

  # TELEMETRY / DIAGNOSTICS
  - !service: {name: 'DiagTrack', operation: change, startup: 4, errorAction: Ignore}
  - !service: {name: 'dmwappushservice', operation: change, startup: 4, errorAction: Ignore}
  # Tiny drops the notification platform; Lite and Standard keep it working
  - !service: {name: 'WpnService', operation: change, startup: 4, errorAction: Ignore, option: profile-tiny}
  - !service: {name: 'WpnUserService', operation: change, startup: 4, errorAction: Ignore, option: profile-tiny}
